plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'org.fluxy'
version = '1.3.3'

ext {
    springDataVersion = '3.2.1'
    hibernateVersion = '6.4.4.Final'
    lombokVersion = '1.18.44'
    fluxyCoreVersion = '1.3.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        name = "GitHubPackagesFluxyCore"
        url = uri("https://maven.pkg.github.com/Fluxy-Orchestrator/fluxy-core")
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = project.findProperty("gpr.key")  ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    // Fluxy Core (transitiva para consumidores)
    api "org.fluxy:fluxy-core:${fluxyCoreVersion}"

    // Spring Data JPA
    implementation "org.springframework.data:spring-data-jpa:${springDataVersion}"

    // Hibernate ORM
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Fluxy-Orchestrator/fluxy-spring")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key")  ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}
